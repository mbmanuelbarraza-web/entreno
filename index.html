<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Entrenamiento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main id="app"></main>

<!-- Descanso entre series (pantalla completa) -->
<div id="descanso" hidden>
  <div class="d-titulo">Descanso</div>
  <div class="d-reloj" id="d-reloj">0:00</div>
  <div class="d-prox" id="d-prox"></div>
  <div class="fila2">
    <button class="sec" data-accion="descanso-mas">+15 s</button>
    <button data-accion="descanso-saltear">Saltear descanso</button>
  </div>
</div>

<!-- Aviso de fin de descanso -->
<div id="flash" hidden data-accion="cerrar-flash">¡A entrenar!<small id="flash-txt"></small><small>Tocá para cerrar</small></div>

<!-- Mensajes cortos -->
<div id="toast" hidden></div>

<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
